[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# internal
api-types = { path = "crates/api-types" }
core-logic = { path = "crates/core" }
db = { path = "crates/db" }

# async / web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "fs", "timeout", "request-id", "util"] }

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# type export
ts-rs = { version = "11", features = ["serde-compat", "uuid-impl", "chrono-impl"] }

# errors / observability / config
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# wasm
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
